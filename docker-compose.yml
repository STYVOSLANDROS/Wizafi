services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wizafi
      POSTGRES_PASSWORD: wizafi_dev_password
      POSTGRES_DB: wizafi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizafi -d wizafi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
